<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060B">
<title>Gacha Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<script>
/* theme: apply the stored theme before first paint so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("gacha-theme");
    if(t === "lime" || t === "midnight") document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>
<style>
  /* --- tokens: shared structure, per-theme palette ---
     The layout below is theme-independent; only the colour tokens change.
     Midnight = navy/cyan, Lime = warm dark/lime. */
  :root{
    color-scheme:dark;
    --page:#05060B; --card:#0D0F1B; --raised:#161828; --field:#0D0F1B; --track:#0D0F1B;
    --border:#262A40; --border-control:#2A2F48; --divider:#23273D;
    --txt:#ECEEF8; --soft:#C9CDE3; --muted:#9AA0BC;
    --acc:#5CE1E6; --acc-done:#9BF0F3; --warn:#FF9A5C;
    --hover:#1B1F33; --focus:#161A2C;
    --ov1:rgba(13,15,27,.88); --ov2:rgba(13,15,27,.55); --ov-info:rgba(13,15,27,.6);
    --display:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:8px; --r-sm:6px;
  }
  html[data-theme="lime"]{
    --page:#161313; --card:#1c1919; --raised:#232020; --field:#151212; --track:#0f0d0d;
    --border:#2d2929; --border-control:#2d2929; --divider:#2d2929;
    --txt:#f5f3f3; --soft:#cfc9c9; --muted:#a09a9a;
    --acc:#76c442; --acc-done:#a8e063; --warn:#ff9a5c;
    --hover:#262222; --focus:#201d1d;
    --ov1:rgba(22,19,19,.88); --ov2:rgba(22,19,19,.55); --ov-info:rgba(22,19,19,.6);
  }

  /* --- page shell: reset, layout, grid --- */
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--page);color:var(--txt);font:400 14px/1.4 var(--display);font-variant-numeric:tabular-nums;padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1800px;margin-inline:auto;touch-action:manipulation;}
  header{position:relative;}
  h1{display:flex;align-items:center;gap:10px;font:600 15px/1.2 var(--display);margin:6px 0 14px;padding:0 140px 0 0;}
  h1::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;}
  .foot{color:var(--muted);font:400 11px/1.4 var(--mono);text-align:center;margin:14px 0 0;}
  .games{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start;}
  @media (min-width:1280px){.games{grid-template-columns:repeat(5,1fr);}}

  /* --- tools: theme / export / import --- */
  .tools{position:absolute;top:0;right:0;z-index:5;display:flex;gap:8px;}
  .tool{width:36px;height:36px;padding:0;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--soft);cursor:pointer;opacity:.6;transition:opacity .15s ease,background .15s ease,color .15s ease;}
  .tool:hover{opacity:1;background:var(--hover);color:var(--acc);}
  .tool:active{background:var(--focus);}
  .tool:focus-visible{opacity:1;outline:2px solid var(--acc);outline-offset:2px;}
  .tool svg{width:18px;height:18px;display:block;}
  .status{min-height:1.4em;margin:0 0 8px;font:400 11px/1.4 var(--mono);color:var(--muted);}
  .status[data-tone="ok"]{color:var(--acc);}
  .status[data-tone="err"]{color:var(--warn);}

  /* --- theme menu --- */
  .theme-wrap{position:relative;}
  .theme-menu{position:absolute;top:42px;right:0;z-index:20;min-width:168px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 14px 34px rgba(0,0,0,.6);}
  .theme-menu[hidden]{display:none;}
  .theme-opt{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;background:none;border:0;border-radius:var(--r-sm);color:var(--soft);font:600 12px/1.2 var(--display);text-align:left;cursor:pointer;}
  .theme-opt:hover{background:var(--hover);color:var(--txt);}
  .theme-opt:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}
  .theme-opt[aria-selected="true"]{color:var(--txt);}
  .swatch{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25);}
  .theme-opt .check{margin-left:auto;color:var(--acc);font:600 12px/1 var(--display);}

  /* --- card frame --- */
  .game{container-type:inline-size;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}

  /* --- header banner + infotip --- */
  .ghead{position:relative;height:64px;display:flex;align-items:center;justify-content:flex-start;background-size:cover;background-position:center 35%;}
  .ghead::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ov1),var(--ov2));}
  .ghead h2{position:relative;margin:0;padding:0 64px 0 18px;font:600 14px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--txt);text-shadow:0 1px 6px rgba(0,0,0,.7);}
  .info-wrap{position:absolute;top:10px;right:10px;}
  .info{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:var(--ov-info);color:var(--txt);font:600 17px/1 var(--display);cursor:pointer;padding:0;}
  .info:hover{border-color:var(--acc);color:var(--acc);}
  .info:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  .tip{display:none;position:absolute;top:52px;right:0;z-index:6;width:max-content;max-width:230px;background:var(--raised);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font:400 12px/1.5 var(--mono);color:var(--soft);text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.6);}
  .info-wrap:hover .tip,.info-wrap:focus-within .tip{display:block;}

  /* --- card body --- */
  .body{display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;}

  /* --- result block (flat) --- */
  .result{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;}
  .result-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 10px;}
  .deficit{display:flex;align-items:baseline;gap:8px;min-width:0;}
  .defnum{font:700 50px/1 var(--display);letter-spacing:-.01em;color:var(--acc);}
  .defnum.done{color:var(--acc-done);}
  .deficit>span{font:400 12px/1.2 var(--display);color:var(--muted);}
  .need{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .cat{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .need b{font:600 14px/1 var(--mono);color:var(--txt);}
  .bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;}
  .fill{display:block;height:100%;width:0;border-radius:4px;background:var(--acc);transition:width .18s ease-out;}
  .caption{display:flex;justify-content:space-between;gap:8px;font:400 10px/1.35 var(--mono);}
  .caption .a,.caption .b{color:var(--muted);}
  .caption .b{text-align:right;}

  /* --- input rows + stepper --- */
  .fields{display:flex;flex-direction:column;}
  .field{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--divider);}
  .field:first-child{border-top:none;}
  .fl{display:flex;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:0 5px;min-width:0;}
  .fl-name{font:600 13px/1.2 var(--display);color:var(--txt);}
  .fl-sub{font:400 10px/1.2 var(--mono);color:var(--muted);white-space:nowrap;}
  .stepper{display:flex;flex:0 0 auto;align-items:center;background:var(--field);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
  .step{width:36px;height:40px;display:grid;place-items:center;background:var(--card);border:0;color:var(--muted);font:400 18px/1 var(--display);cursor:pointer;padding:0;}
  .step:hover:not(:disabled){background:var(--hover);color:var(--acc);}
  .step:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}
  .step:disabled{opacity:.35;cursor:default;}
  .sinput{width:66px;height:40px;min-width:0;padding:0 2px;background:transparent;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--txt);font:600 13px/1 var(--mono);text-align:center;}
  .sinput:focus{background:var(--focus);outline:0;}
  .sinput:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}

  /* --- resin panel --- */
  .resin{margin:0;}
  .resin-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 16px;background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--acc);border-radius:var(--r-sm);color:var(--muted);font:600 12px/1 var(--display);cursor:pointer;list-style:none;}
  .resin-btn::-webkit-details-marker{display:none;}
  .resin-btn::marker{content:"";}
  .resin-btn:hover{background:var(--hover);}
  .resin-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  .resin-right{display:flex;align-items:center;gap:6px;font:600 14px/1 var(--mono);color:var(--txt);}
  .chev{color:var(--muted);transition:transform .18s ease-out;}
  details[open] .chev{transform:rotate(90deg);}
  .resin-body{margin-top:10px;background:var(--raised);border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 12px 6px;}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--divider);}
  .rrow:first-child{border-top:none;}
  .rlabel{flex:0 0 auto;font:500 12px/1.2 var(--display);color:var(--muted);}
  .rout{font:500 12px/1.2 var(--mono);color:var(--txt);text-align:right;}
  .rout.big{font-weight:600;font-size:14px;color:var(--acc);}
  .well{flex:0 0 auto;width:104px;height:36px;padding:0 8px;background:var(--field);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--txt);font:600 13px/1 var(--mono);text-align:center;}
  .well:focus{background:var(--focus);outline:0;}
  .well:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}

  /* --- narrow cards: container query on .game --- */
  @container (max-width:320px){
    .body{padding:14px 14px 14px;gap:9px;}
    .sinput{width:58px;}
    .fl-name{font-size:12px;}
    .fl-sub{white-space:normal;}
    .defnum{font-size:40px;}
    .ghead h2{font-size:13px;}
    .well{width:88px;}
  }

  /* --- motion --- */
  @media (prefers-reduced-motion:reduce){
    .chev,.fill{transition:none;}
  }
</style>
</head>
<body>
<header>
  <h1>Gacha Tracker</h1>
  <div class="tools">
    <div class="theme-wrap">
      <button type="button" class="tool" id="themeBtn" aria-label="Change theme" aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" title="Change theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="theme-menu" id="themeMenu" role="listbox" aria-label="Theme" hidden></div>
    </div>
    <button type="button" class="tool" id="exportBtn" aria-label="Export JSON" title="Export JSON">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
    </button>
    <button type="button" class="tool" id="importBtn" aria-label="Import JSON" title="Import JSON">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>
    </button>
    <input type="file" id="importFile" accept="application/json,.json" aria-label="Choose a gacha-tracker JSON backup to import" hidden>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>
<main class="games" id="games"></main>
<p class="foot">values autosave locally · timer refreshes every 30s</p>
<script>
/* ===== data: per-game config — the only constants that vary per game ===== */
// gemPerPull: gems per pull | glitterPerPull: 2nd currency per pull (1 = direct tickets)
// targetMult: Target pulls = target count * this | deficitPerPull: gems per deficit pull (kept as in sheet)
// resinCap/regenMin: null = no resin section for that game
const GAMES = [
  { id:"NTE", gemPerPull:160, glitterPerPull:24, glitterName:"Starglitter", targetMult:80, deficitPerPull:160, resinCap:360, regenMin:6,
    defaults:{ gems:35617, rolls:4, glitter:1684, pity:2, target:4, resin:24, thresh:40 } },
  { id:"ZZZ", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:160, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:28159, rolls:16, glitter:1400, pity:30, target:2, resin:1, thresh:60 } },
  { id:"GFL2", gemPerPull:150, glitterPerPull:30, glitterName:"Starglitter", targetMult:130, deficitPerPull:160, resinCap:260, regenMin:5,
    defaults:{ gems:62404, rolls:5, glitter:7650, pity:0, target:6, resin:22, thresh:120 } },
  { id:"CZN", gemPerPull:160, glitterPerPull:10, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:320, regenMin:6,
    defaults:{ gems:30731, rolls:13, glitter:958, pity:33, target:3, resin:105, thresh:20 } },
  { id:"Endfield", gemPerPull:500, glitterPerPull:25, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:360, regenMin:7.2,
    defaults:{ gems:45275, rolls:0, glitter:1200, pity:0, target:2, resin:8, thresh:20 } },
  { id:"WuWa", gemPerPull:160, glitterPerPull:8, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:22427, rolls:16, glitter:805, pity:67, target:3, resin:1, thresh:180 } },
  { id:"Nikke", gemPerPull:300, glitterPerPull:1, glitterName:"Tickets", targetMult:200, deficitPerPull:300, resinCap:null, regenMin:null,
    defaults:{ gems:70205, rolls:0, glitter:1513, pity:0, target:9 } },
  { id:"Genshin", gemPerPull:160, glitterPerPull:5, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:200, regenMin:8,
    defaults:{ gems:43971, rolls:17, glitter:127, pity:0, target:3, resin:5, thresh:40 } },
  { id:"Stella Sora", gemPerPull:300, glitterPerPull:100, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:240, regenMin:null,
    defaults:{ gems:92440, rolls:16, glitter:6320, pity:5, target:4 } },
  { id:"HSR", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:300, regenMin:6,
    defaults:{ gems:41843, rolls:15, glitter:1820, pity:90, target:4, resin:22, thresh:60 } },
];

/* ===== pure math: no DOM, no globals — unit-tested by test/calc.test.js =====
   Keep this section DOM-free: it is the natural seam if the file is ever split.
   computePulls(g, v)      -> pull counts, effective rolls, need, deficit, progress
   computeResin(g, v, now) -> resin regen state, or null when never checked     */
function computePulls(g, v){
  const gemPulls   = Math.floor((v.gems||0)/g.gemPerPull);
  const tokenPulls = Math.floor((v.glitter||0)/g.glitterPerPull);
  const pity = v.pity||0, target = v.target||0;
  const eff = gemPulls + (v.rolls||0) + tokenPulls;
  const need = target*g.targetMult, pulls = need - pity, def = pulls - eff;
  return {
    gemPulls, tokenPulls, pity, target, eff, need, pulls, def,
    short: def>0,
    needCurrency: def>0 ? def*g.deficitPerPull : 0,
    pct: pulls<=0 ? 100 : Math.max(0, Math.min(100, eff/pulls*100)),
  };
}
function computeResin(g, v, now){
  if(!g.resinCap || !g.regenMin) return null;
  const t = v.checked ? new Date(v.checked) : null;
  if(!t || isNaN(t)) return null;
  const elMin  = Math.max(0,(now - t.getTime())/60000);
  const cur    = Math.min(g.resinCap, (v.resin||0) + elMin/g.regenMin);
  const thresh = v.thresh||0;
  return {
    t, elMin, cur, thresh,
    fullH: (g.resinCap-cur)*g.regenMin/60,
    xH:    Math.max(0,(thresh-cur)*g.regenMin/60),
  };
}

/* ===== helpers: DOM lookups + number/date formatting ===== */
const $ = id => document.getElementById(id);
const NFmt = new Intl.NumberFormat();
function fmtDur(h){ if(!isFinite(h)||h<0) return "—"; if(h<=0) return "full"; const m=Math.round(h*60); return Math.floor(m/60)>0?`${Math.floor(m/60)}h ${m%60}m`:`${m%60}m`; }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtStamp(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const rawOf = id => { const el=$(id); return el?el.value.replace(/[^\d]/g,""):""; };
const numOf = id => { const r=rawOf(id); return r===""?0:+r; };
function setText(el,t){ if(el&&el.textContent!==t) el.textContent=t; }
function setNum(id,v){ const el=$(id); if(!el) return; const r=String(v==null?"":v).replace(/[^\d]/g,""); el.value = r===""?"":NFmt.format(+r); }
function fmtRaw(v){ return v===""?"":NFmt.format(+v); }

/* ===== view: card markup (element ids are the contract with calc() below) ===== */
const FIELDS = [
  ["gems",   "Currency", "gemPulls"],
  ["rolls",  "Rolls",    null],
  ["glitter","Tokens",   "glitterPulls"],
  ["pity",   "Pity",     null],
  ["target", "Target",   "targetPulls"],
];

function render(g){
  const p = g.id;
  const slug = p.toLowerCase().replace(/\s+/g,"-");
  const spec = `${g.targetMult} pity · ${g.gemPerPull}/pull · ${g.glitterPerPull} tokens` + (g.resinCap?` · ${g.resinCap} cap · ${g.regenMin}min`:"");
  const fields = FIELDS.map(([key,label,subId])=>`
      <div class="field">
        <label class="fl" for="${p}-${key}">
          <span class="fl-name">${label}</span>${subId?`\n          <span class="fl-sub" id="${p}-${subId}">—</span>`:""}
        </label>
        <div class="stepper">
          <button type="button" tabindex="-1" class="step" data-target="${p}-${key}" data-d="-1" aria-label="Decrease ${label} for ${p}">−</button>
          <input class="num sinput" type="text" id="${p}-${key}" name="${p}-${key}" inputmode="numeric" autocomplete="off" aria-label="${label} for ${p}">
          <button type="button" tabindex="-1" class="step" data-target="${p}-${key}" data-d="1" aria-label="Increase ${label} for ${p}">+</button>
        </div>
      </div>`).join("");
  const hasResin = !!(g.resinCap && g.regenMin);
  const resin = hasResin ? `
    <details class="resin">
      <summary class="resin-btn">
        <span>Resin</span>
        <span class="resin-right"><span id="${p}-resinSummary">—</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </summary>
      <div class="resin-body">
        <div class="rrow"><label class="rlabel" for="${p}-resin">Last resin</label><input class="num well" type="text" id="${p}-resin" name="${p}-resin" inputmode="numeric" autocomplete="off" aria-label="Last resin for ${p}"></div>
        <div class="rrow"><div class="rlabel">Last checked</div><div class="rout" id="${p}-checked">—</div></div>
        <div class="rrow"><div class="rlabel">Time since</div><div class="rout" id="${p}-since">—</div></div>
        <div class="rrow"><div class="rlabel">Current</div><div class="rout big" id="${p}-cur">—</div></div>
        <div class="rrow"><div class="rlabel">Full in</div><div class="rout" id="${p}-fullIn">—</div></div>
        <div class="rrow"><div class="rlabel">Full at</div><div class="rout" id="${p}-fullAt">—</div></div>
        <div class="rrow"><label class="rlabel" for="${p}-thresh">X</label><input class="num well" type="text" id="${p}-thresh" name="${p}-thresh" inputmode="numeric" autocomplete="off" aria-label="Resin alert threshold for ${p}"></div>
        <div class="rrow"><div class="rlabel">X in</div><div class="rout" id="${p}-xIn">—</div></div>
      </div>
    </details>` : "";
  return `<div class="game" id="game-${p}">
    <div class="ghead" style="background-image:url('assets/${slug}.jpg')">
      <h2 translate="no">${p}</h2>
      <span class="info-wrap">
        <button type="button" tabindex="-1" class="info" aria-label="${p} rates and limits" aria-describedby="${p}-tip">i</button>
        <span class="tip" role="tooltip" id="${p}-tip">${spec}</span>
      </span>
    </div>
    <div class="body">
      <section class="result" aria-live="polite">
        <div class="result-top">
          <div class="deficit"><b class="defnum" id="${p}-defPulls">—</b><span id="${p}-defLabel">pulls short</span></div>
          <div class="need"><span class="cat">Need</span><b id="${p}-defGems">—</b></div>
        </div>
        <div class="bar" id="${p}-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress toward target"><span class="fill" id="${p}-fill"></span></div>
        <div class="caption">
          <span class="a"><span id="${p}-eff">—</span> eff. rolls</span>
          <span class="b"><span id="${p}-need">—</span> needed (<span id="${p}-targetEcho">—</span> − <span id="${p}-pityEcho">—</span> pity)</span>
        </div>
      </section>
      <div class="fields">${fields}
      </div>
      ${resin}
    </div>
  </div>`;
}

/* ===== update: read DOM → compute → write DOM → persist ===== */
function calc(g){
  const p = g.id, now = Date.now();
  const r = computePulls(g, {
    gems:numOf(`${p}-gems`), rolls:numOf(`${p}-rolls`), glitter:numOf(`${p}-glitter`),
    pity:numOf(`${p}-pity`), target:numOf(`${p}-target`),
  });

  setText($(`${p}-gemPulls`), `= ${NFmt.format(r.gemPulls)} pulls`);
  setText($(`${p}-glitterPulls`), `= ${NFmt.format(r.tokenPulls)} pulls`);
  setText($(`${p}-targetPulls`), `= ${NFmt.format(r.need)} pulls`);

  const big=$(`${p}-defPulls`);
  setText(big, NFmt.format(r.short?r.def:Math.abs(r.def)));
  big.className = "defnum"+(r.short?"":" done");
  setText($(`${p}-defLabel`), r.short?"pulls short":(r.def===0?"goal reached":"pulls spare"));
  setText($(`${p}-defGems`), NFmt.format(r.needCurrency));
  setText($(`${p}-eff`), NFmt.format(r.eff));
  setText($(`${p}-need`), NFmt.format(r.pulls));
  setText($(`${p}-targetEcho`), NFmt.format(r.need));
  setText($(`${p}-pityEcho`), NFmt.format(r.pity));

  $(`${p}-fill`).style.width = r.pct.toFixed(1)+"%";
  $(`${p}-bar`).setAttribute("aria-valuenow", String(Math.round(r.pct)));

  const root=$("game-"+p);
  if(root) root.querySelectorAll('.step[data-d="-1"]').forEach(b=>{ b.disabled = numOf(b.dataset.target)<=0; });

  if(g.resinCap && g.regenMin){
    const rs = computeResin(g, {resin:numOf(`${p}-resin`), thresh:numOf(`${p}-thresh`), checked:CHECKED[p]}, now);
    if(rs){
      setText($(`${p}-checked`), fmtStamp(rs.t));
      setText($(`${p}-since`), `${Math.floor(rs.elMin/60)}h ${Math.floor(rs.elMin%60)}m ago`);
      setText($(`${p}-cur`), `${Math.floor(rs.cur)} / ${g.resinCap}`);
      setText($(`${p}-fullIn`), fmtDur(rs.fullH));
      setText($(`${p}-fullAt`), rs.fullH<=0?"—":fmtStamp(new Date(now+rs.fullH*3600e3)));
      setText($(`${p}-xIn`), rs.thresh<=0?"—":(rs.xH<=0?"reached":fmtDur(rs.xH)));
      setText($(`${p}-resinSummary`), `${Math.floor(rs.cur)}/${g.resinCap}`);
    } else {
      ["checked","since","cur","fullIn","fullAt","xIn"].forEach(k=>setText($(`${p}-${k}`),"—"));
      setText($(`${p}-resinSummary`),"—");
    }
  }
  const data={gems:rawOf(`${p}-gems`),rolls:rawOf(`${p}-rolls`),glitter:rawOf(`${p}-glitter`),pity:rawOf(`${p}-pity`),target:rawOf(`${p}-target`)};
  if(g.resinCap){ data.resin=rawOf(`${p}-resin`); data.checked=CHECKED[p]||""; data.thresh=rawOf(`${p}-thresh`); }
  localStorage.setItem("gacha-"+p, JSON.stringify(data));
}
function calcAll(){ GAMES.forEach(calc); }
const CHECKED = {};   // per-game "last checked" stamp (local "YYYY-MM-DDTHH:mm"), set only by editing Last resin

/* ===== backup: the persisted values as a .json file =====
   The file is exactly the stored shape — { "<game id>": { field: value } } — so a
   hand-edited or partial file imports fine. */
function exportData(){
  const out = {};
  GAMES.forEach(g=>{
    try{ out[g.id] = JSON.parse(localStorage.getItem("gacha-"+g.id)||"{}"); }catch{ out[g.id] = {}; }
  });
  const name = `gacha-tracker-${nowLocal().slice(0,10)}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)+"\n"],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return name;
}
function importData(data){   // throws on anything that is not a game map
  if(!data || typeof data !== "object" || Array.isArray(data)) throw new Error("not a game map");
  Object.keys(data).forEach(id=>localStorage.setItem("gacha-"+id, JSON.stringify(data[id])));
  loadState(); calcAll();
}
function setStatus(msg, tone){
  const el = $("status"); if(!el) return;
  el.textContent = msg||""; el.dataset.tone = tone||"";
}
async function importBackupFile(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch{ return setStatus("Could not read that file as JSON.", "err"); }
  if(!confirm(`Replace all saved values with "${file.name}"?`)) return setStatus("Import cancelled — nothing changed.", "");
  try{ importData(data); setStatus(`Imported "${file.name}".`, "ok"); }
  catch{ setStatus(`"${file.name}" is not a gacha-tracker backup.`, "err"); }
}

/* ===== theme: palette switch (layout is shared; only the CSS tokens change) =====
   The choice lives in its own localStorage key so the game data and the
   export/import JSON format stay exactly as documented. */
const THEMES = [
  { id:"midnight", name:"Midnight", swatch:"#5CE1E6", page:"#05060B" },
  { id:"lime",     name:"Lime",     swatch:"#76c442", page:"#161313" },
];
const THEME_KEY = "gacha-theme";

function currentTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.some(x=>x.id===t) ? t : "midnight";
  }catch{ return "midnight"; }
}
function applyTheme(id, announce){
  const th = THEMES.find(x=>x.id===id) || THEMES[0];
  document.documentElement.dataset.theme = th.id;
  try{ localStorage.setItem(THEME_KEY, th.id); }catch{}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = th.page;
  document.querySelectorAll(".theme-opt").forEach(b=>{
    const on = b.dataset.theme === th.id;
    b.setAttribute("aria-selected", on ? "true" : "false");
    const chk = b.querySelector(".check");
    if(chk) chk.textContent = on ? "✓" : "";
  });
  const btn = $("themeBtn");
  if(btn){
    btn.setAttribute("aria-label", `Theme: ${th.name} — change`);
    btn.setAttribute("title", `Theme: ${th.name}`);
  }
  if(announce) setStatus(`Theme: ${th.name}.`);
}
function initTheme(){
  const btn = $("themeBtn"), menu = $("themeMenu");
  if(!btn || !menu) return;
  menu.innerHTML = THEMES.map(t=>`
      <button type="button" class="theme-opt" role="option" aria-selected="false" data-theme="${t.id}">
        <span class="swatch" style="background:${t.swatch}"></span>
        <span class="tname">${t.name}</span>
        <span class="check"></span>
      </button>`).join("");
  const opts = () => Array.from(menu.querySelectorAll(".theme-opt"));
  const isOpen = () => !menu.hidden;
  const open = () => { menu.hidden = false; btn.setAttribute("aria-expanded","true"); };
  const close = (refocus) => { menu.hidden = true; btn.setAttribute("aria-expanded","false"); if(refocus) btn.focus(); };

  btn.addEventListener("click", e=>{ e.stopPropagation(); isOpen() ? close(false) : open(); });
  menu.addEventListener("click", e=>{
    const b = e.target.closest(".theme-opt");
    if(!b) return;
    applyTheme(b.dataset.theme, true);
    close(false); btn.focus();
  });
  document.addEventListener("click", e=>{ if(isOpen() && !e.target.closest(".theme-wrap")) close(false); });
  document.addEventListener("keydown", e=>{
    if(!isOpen()) return;
    const list = opts(), cur = list.indexOf(document.activeElement);
    if(e.key === "Escape"){ close(true); e.preventDefault(); }
    else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const next = cur < 0 ? 0 : (e.key === "ArrowDown" ? (cur+1)%list.length : (cur-1+list.length)%list.length);
      list[next].focus();
    }
    else if(e.key === "Home"){ e.preventDefault(); list[0].focus(); }
    else if(e.key === "End"){ e.preventDefault(); list[list.length-1].focus(); }
    else if(e.key === "Tab"){ close(false); }
  });
  applyTheme(currentTheme(), false);
}

/* ===== startup: mount cards, wire events, load saved state ===== */
// fill every input from localStorage, falling back to each game's defaults
function loadState(){
  GAMES.forEach(g=>{
    const p = g.id; let s = {};
    try{ s = JSON.parse(localStorage.getItem("gacha-"+p)||"{}"); }catch{}
    if(!s || typeof s !== "object") s = {};
    FIELDS.forEach(([key])=>{ setNum(`${p}-${key}`, s[key] ?? g.defaults[key]); });
    if(g.resinCap && g.regenMin){
      setNum(`${p}-resin`, s.resin ?? g.defaults.resin);
      setNum(`${p}-thresh`, s.thresh ?? g.defaults.thresh);
      CHECKED[p] = s.checked || "";
    }
  });
}

function init(){
  $("games").innerHTML = GAMES.map(render).join("");

  // numeric inputs: raw while focused, thousands-separated when not
  document.querySelectorAll(".num").forEach(el=>{
    el.addEventListener("focus", ()=>{ el.value = el.value.replace(/[^\d]/g,""); });
    el.addEventListener("blur", ()=>{ el.value = fmtRaw(el.value.replace(/[^\d]/g,"")); calcAll(); });
  });
  document.addEventListener("input", e=>{
    const el = e.target;
    if(!el.classList || !el.classList.contains("num")) return;
    const raw = el.value.replace(/[^\d]/g,"");
    if(el.value !== raw) el.value = raw;
    calcAll();
  });

  // steppers
  document.querySelectorAll(".step").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const inp = $(btn.dataset.target);
      const v = Math.max(0, numOf(btn.dataset.target) + (+btn.dataset.d));
      inp.value = String(v);
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.value = NFmt.format(v);
    });
  });

  GAMES.forEach(g=>{
    if(g.resinCap && g.regenMin) $(`${g.id}-resin`).addEventListener("input", ()=>{ CHECKED[g.id]=nowLocal(); });
  });

  // export / import the saved state as a .json file
  $("exportBtn").addEventListener("click", ()=>{ setStatus(`Exported all ${GAMES.length} games to ${exportData()}.`, "ok"); });
  $("importBtn").addEventListener("click", ()=>$("importFile").click());
  $("importFile").addEventListener("change", e=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = "";   // clear so re-picking the same file fires again
    if(file) importBackupFile(file);
  });

  initTheme();

  loadState();
  calcAll(); setInterval(calcAll,30000);
}
if(typeof document !== "undefined") init();   // undefined in node, so tests can load the math
</script>
</body>
