<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gacha Tracker</title>
<style>
  :root { color-scheme: dark; --bg:#121418; --card:#1c1f26; --line:#2c313c; --txt:#e8eaf0; --dim:#9aa3b2; --good:#5fd68a; --warn:#ff9d5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.35 system-ui, sans-serif; padding:10px; max-width:1400px; margin-inline:auto; }
  h1 { font-size:20px; margin:4px 0 12px; text-align:center; }
  .games { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); align-items:start; }
  .game { border:1px solid var(--line); border-radius:14px; padding:10px; background:#16181d; }
  .ghead { position:relative; border:1px solid var(--line); border-radius:10px; background-size:cover; background-position:center; text-align:center; padding:24px 10px; margin-bottom:10px; overflow:hidden; }
  .ghead::before { content:""; position:absolute; inset:0; background:linear-gradient(rgba(8,10,14,.62), rgba(8,10,14,.62)); }
  .ghead h2 { position:relative; margin:0; font-size:19px; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.85); }
  .ghead .cfg { position:relative; margin:6px 0 0; }
  .cfg { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .cfg code { color:var(--txt); background:#262b36; padding:1px 6px; border-radius:6px; margin-right:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:2px 12px 6px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .label { font-weight:600; }
  .val { text-align:right; }
  input[type=number], input[type=datetime-local] { background:#10131a; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 8px; width:130px; font-size:14px; }
  input[type=datetime-local] { width:180px; font-size:12px; }
  .out { font-size:14px; font-variant-numeric:tabular-nums; }
  .out.big { font-size:17px; font-weight:700; }
  .good { color:var(--good); } .warn { color:var(--warn); } .dim { color:var(--dim); }
  details.card { padding:2px 12px 6px; }
  details.card summary { cursor:pointer; padding:7px 0; font-weight:700; list-style:none; display:flex; justify-content:space-between; }
  details.card summary::-webkit-details-marker { display:none; }
  .foot { color:var(--dim); font-size:11px; text-align:center; margin-top:6px; }
</style>
</head>
<body>
<h1>Gacha Tracker</h1>
<div class="games" id="games"></div>
<div class="foot">values autosave locally · timer refreshes every 30s</div>
<script>
// gemPerPull: gems per pull | glitterPerPull: 2nd currency per pull (1 = direct tickets)
// targetMult: Target pulls = target count * this | deficitPerPull: gems per deficit pull (kept as in sheet)
// resinCap/regenMin: null = no resin section for that game
const GAMES = [
  { id:"NTE", gemPerPull:160, glitterPerPull:24, glitterName:"Starglitter", targetMult:80, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:35617, rolls:4, glitter:1684, pity:2, target:4, resin:24, thresh:40 } },
  { id:"ZZZ", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:160, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:28159, rolls:16, glitter:1400, pity:30, target:2, resin:1, thresh:60 } },
  { id:"Genshin", gemPerPull:160, glitterPerPull:5, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:200, regenMin:8,
    defaults:{ gems:43971, rolls:17, glitter:127, pity:0, target:3, resin:5, thresh:40 } },
  { id:"GFL2", gemPerPull:150, glitterPerPull:30, glitterName:"Starglitter", targetMult:130, deficitPerPull:160, resinCap:260, regenMin:5,
    defaults:{ gems:62404, rolls:5, glitter:7650, pity:0, target:6, resin:22, thresh:120 } },
  { id:"CZN", gemPerPull:160, glitterPerPull:10, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:314, regenMin:6,
    defaults:{ gems:30731, rolls:13, glitter:958, pity:33, target:3, resin:105, thresh:20 } },
  { id:"Endfield", gemPerPull:500, glitterPerPull:25, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:350, regenMin:7.2,
    defaults:{ gems:45275, rolls:0, glitter:1200, pity:0, target:2, resin:8, thresh:20 } },
  { id:"Nikke", gemPerPull:300, glitterPerPull:1, glitterName:"Tickets", targetMult:200, deficitPerPull:300, resinCap:null, regenMin:null,
    defaults:{ gems:70205, rolls:0, glitter:1513, pity:0, target:9 } },
  { id:"Stella Sora", gemPerPull:300, glitterPerPull:100, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:null, regenMin:null,
    defaults:{ gems:92440, rolls:16, glitter:6320, pity:5, target:4 } },
  { id:"WuWa", gemPerPull:160, glitterPerPull:8, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:22427, rolls:16, glitter:805, pity:67, target:3, resin:1, thresh:180 } },
  { id:"HSR", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:300, regenMin:6,
    defaults:{ gems:41843, rolls:15, glitter:1820, pity:90, target:4, resin:22, thresh:60 } },
];
const $ = id => document.getElementById(id);
function fmtDur(h){ if(!isFinite(h)||h<0) return "—"; if(h<=0) return "full"; const m=Math.round(h*60); return Math.floor(m/60)>0?`${Math.floor(m/60)}h ${m%60}m`:`${m%60}m`; }
function fmtDate(d){ return d.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

function render(g){
  const p = g.id;
  const resin = (g.resinCap && g.regenMin) ? `
    <details class="card"><summary><span>Resin</span><span class="dim" id="${p}-resinSummary">—</span></summary>
      <div class="row"><div class="label">Last resin</div><div class="val"><input type="number" id="${p}-resin" min="0"></div></div>
      <div class="row"><div class="label">Last checked</div><div class="val"><input type="datetime-local" id="${p}-checked"></div></div>
      <div class="row"><div class="label">Time since</div><div class="val"><div class="out" id="${p}-since">—</div></div></div>
      <div class="row"><div class="label">Current</div><div class="val"><div class="out big" id="${p}-cur">—</div></div></div>
      <div class="row"><div class="label">Full in</div><div class="val"><div class="out" id="${p}-fullIn">—</div></div></div>
      <div class="row"><div class="label">Full at</div><div class="val"><div class="out" id="${p}-fullAt">—</div></div></div>
      <div class="row"><div class="label">X</div><div class="val"><input type="number" id="${p}-thresh" min="0"></div></div>
      <div class="row"><div class="label">X in</div><div class="val"><div class="out" id="${p}-xIn">—</div></div></div>
    </details>` : "";
  const slug = p.toLowerCase().replace(/\s+/g,"-");
  return `<div class="game" id="game-${p}">
    <div class="ghead" style="background-image:url('assets/${slug}.jpg')">
      <h2>${p}</h2>
      <div class="cfg"><code>${g.targetMult} pity</code><code>${g.gemPerPull}/pull</code><code>${g.glitterPerPull} tokens</code>${g.resinCap?`<code>${g.resinCap} cap</code><code>${g.regenMin}min</code>`:""}</div>
    </div>
    <div class="card">
      <div class="row"><div class="label">Currency</div><div class="val"><input type="number" id="${p}-gems" min="0"><div class="out dim" id="${p}-gemPulls">—</div></div></div>
      <div class="row"><div class="label">Rolls</div><div class="val"><input type="number" id="${p}-rolls" min="0"></div></div>
      <div class="row"><div class="label">Tokens</div><div class="val"><input type="number" id="${p}-glitter" min="0"><div class="out dim" id="${p}-glitterPulls">—</div></div></div>
      <div class="row"><div class="label">Eff. Rolls</div><div class="val"><div class="out big" id="${p}-eff">—</div></div></div>
      <div class="row"><div class="label">Pity</div><div class="val"><input type="number" id="${p}-pity" min="0"></div></div>
      <div class="row"><div class="label">Target</div><div class="val"><input type="number" id="${p}-target" min="0"><div class="out dim" id="${p}-targetPulls">—</div></div></div>
      <div class="row"><div class="label">Deficit</div><div class="val"><div class="out big" id="${p}-defPulls">—</div><div class="out dim" id="${p}-defGems">—</div></div></div>
    </div>
    ${resin}
  </div>`;
}

function calc(g){
  const p = g.id;
  const gv = id => $(`${p}-${id}`) ? $(`${p}-${id}`).value : "";
  const gem=+gv("gems")||0, rol=+gv("rolls")||0, gli=+gv("glitter")||0, pity=+gv("pity")||0, tgt=+gv("target")||0;
  const gp=Math.floor(gem/g.gemPerPull), sp=Math.floor(gli/g.glitterPerPull);
  const eff=gp+rol+sp, need=tgt*g.targetMult, def=need-pity-eff;
  $(`${p}-gemPulls`).textContent=`${gp} pulls`;
  $(`${p}-glitterPulls`).textContent=`${sp} pulls`;
  $(`${p}-eff`).textContent=eff;
  $(`${p}-targetPulls`).textContent=`${need} pulls`;
  $(`${p}-defPulls`).textContent=def<=0?"done ✓":`${def} pulls`;
  $(`${p}-defPulls`).className="out big "+(def<=0?"good":"warn");
  $(`${p}-defGems`).textContent=def<=0?"0":`${(def*g.deficitPerPull).toLocaleString()}`;
  if(g.resinCap && g.regenMin){
    const last=+gv("resin")||0, t=gv("checked")?new Date(gv("checked")):null;
    if(t&&!isNaN(t)){
      const elMin=Math.max(0,(Date.now()-t.getTime())/60000);
      const cur=Math.min(g.resinCap,last+elMin/g.regenMin);
      const fullH=(g.resinCap-cur)*g.regenMin/60, X=+gv("thresh")||0, xH=Math.max(0,(X-cur)*g.regenMin/60);
      $(`${p}-since`).textContent=`${Math.floor(elMin/60)}h ${Math.floor(elMin%60)}m ago`;
      $(`${p}-cur`).textContent=`${Math.floor(cur)} / ${g.resinCap}`;
      $(`${p}-fullIn`).textContent=fmtDur(fullH);
      $(`${p}-fullAt`).textContent=fullH<=0?"—":fmtDate(new Date(Date.now()+fullH*3600e3));
      $(`${p}-xIn`).textContent=X<=0?"—":(xH<=0?"reached":fmtDur(xH));
      $(`${p}-resinSummary`).textContent=`${Math.floor(cur)}/${g.resinCap}`;
    } else { ["since","cur","fullIn","fullAt","xIn"].forEach(k=>$(`${p}-${k}`).textContent="—"); $(`${p}-resinSummary`).textContent="—"; }
  }
  const data={gems:gv("gems"),rolls:gv("rolls"),glitter:gv("glitter"),pity:gv("pity"),target:gv("target")};
  if(g.resinCap){ data.resin=gv("resin"); data.checked=gv("checked"); data.thresh=gv("thresh"); }
  localStorage.setItem("gacha-"+p,JSON.stringify(data));
}
function calcAll(){ GAMES.forEach(calc); }

(function init(){
  $("games").innerHTML = GAMES.map(render).join("");
  GAMES.forEach(g=>{
    const p=g.id; let s={}; try{ s=JSON.parse(localStorage.getItem("gacha-"+p)||"{}"); }catch{}
    $(`${p}-gems`).value=s.gems??g.defaults.gems; $(`${p}-rolls`).value=s.rolls??g.defaults.rolls;
    $(`${p}-glitter`).value=s.glitter??g.defaults.glitter; $(`${p}-pity`).value=s.pity??g.defaults.pity;
    $(`${p}-target`).value=s.target??g.defaults.target;
    if(g.resinCap){
      $(`${p}-resin`).value=s.resin??g.defaults.resin;
      $(`${p}-thresh`).value=s.thresh??g.defaults.thresh;
      if(s.checked)$(`${p}-checked`).value=s.checked;
      ["gems","rolls","glitter","pity","target","resin","checked","thresh"].forEach(k=>$(`${p}-${k}`).addEventListener("input",calcAll));
      $(`${p}-resin`).addEventListener("input",()=>{ $(`${p}-checked`).value=nowLocal(); });
    } else {
      ["gems","rolls","glitter","pity","target"].forEach(k=>$(`${p}-${k}`).addEventListener("input",calcAll));
    }
  });
  calcAll(); setInterval(calcAll,30000);
})();
</script>
</body>
</html>
