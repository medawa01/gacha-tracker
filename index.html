<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060B">
<title>Gacha Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root{
    color-scheme:dark;
    --page:#05060B; --bg:#0D0F1B; --surface:#161828; --border:#262A40; --border-control:#2A2F48;
    --divider:#23273D; --txt:#ECEEF8; --soft:#C9CDE3; --muted:#9AA0BC; --acc:#5CE1E6; --warn:#FF9A5C;
    --hover:#1B1F33; --focus:#161A2C;
    --display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--page);color:var(--txt);font:400 14px/1.4 var(--display);padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));max-width:1600px;margin-inline:auto;touch-action:manipulation;}
  h1{font:700 20px/1.2 var(--display);margin:2px 0 12px;text-align:center;letter-spacing:.02em;text-wrap:balance;}
  .foot{color:var(--muted);font:400 11px/1.4 var(--mono);text-align:center;margin:10px 0 0;}
  .games{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start;}
  @media (min-width:1280px){.games{grid-template-columns:repeat(5,1fr);}}

  .game{container-type:inline-size;background:var(--bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.55);}

  /* header banner */
  .ghead{position:relative;height:64px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center 35%;}
  .ghead::before{content:"";position:absolute;inset:0;background:rgba(13,15,27,.5);}
  .ghead h2{position:relative;margin:0;padding:0 46px;font:700 22px/1.1 var(--display);letter-spacing:.04em;color:#fff;text-align:center;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.8);}
  .info-wrap{position:absolute;top:10px;right:10px;}
  .info{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(13,15,27,.55);color:#fff;font:700 18px/1 var(--display);cursor:pointer;padding:0;}
  .info:hover{background:rgba(92,225,230,.22);}
  .info:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  .tip{display:none;position:absolute;top:52px;right:0;z-index:6;width:max-content;max-width:230px;background:var(--surface);border:1px solid var(--border-control);border-radius:12px;padding:8px 10px;font:400 12px/1.5 var(--mono);color:var(--soft);text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.65);}
  .info-wrap:hover .tip,.info-wrap:focus-within .tip{display:block;}

  /* body */
  .body{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px;}

  /* result block */
  .result{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;}
  .result-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 10px;}
  .deficit{display:flex;align-items:baseline;gap:8px;min-width:0;}
  .defnum{font:700 44px/1 var(--display);letter-spacing:-.01em;color:var(--warn);}
  .defnum.done{color:var(--acc);}
  .deficit>span{font:500 15px/1.2 var(--display);color:var(--soft);}
  .need{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .cat{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .need b{font:600 16px/1 var(--mono);color:var(--txt);}
  .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;}
  .fill{display:block;height:100%;width:0;border-radius:4px;background:var(--acc);transition:width .18s ease-out;}
  .caption{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.35 var(--mono);}
  .caption .a{color:var(--acc);}
  .caption .b{color:var(--muted);text-align:right;}

  /* input rows */
  .fields{display:flex;flex-direction:column;}
  .field{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--divider);}
  .field:first-child{border-top:none;}
  .fl{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .fl-name{font:600 15px/1.2 var(--display);color:var(--txt);}
  .fl-sub{font:500 12px/1.2 var(--mono);color:var(--acc);white-space:nowrap;}
  .stepper{display:flex;flex:0 0 auto;align-items:center;background:var(--bg);border:1px solid var(--border-control);border-radius:12px;overflow:hidden;}
  .step{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;color:var(--muted);font:500 20px/1 var(--display);cursor:pointer;padding:0;}
  .step:hover:not(:disabled){background:var(--hover);color:#fff;}
  .step:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}
  .step:disabled{opacity:.4;cursor:default;}
  .sinput{width:84px;height:44px;min-width:0;padding:0 2px;background:transparent;border:0;border-left:1px solid var(--border-control);border-right:1px solid var(--border-control);color:var(--txt);font:500 16px/1 var(--mono);text-align:center;}
  .sinput:focus{background:var(--focus);outline:0;}
  .sinput:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;}

  /* resin */
  .resin{margin:0;}
  .resin-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 14px;background:transparent;border:1px solid var(--border-control);border-radius:12px;color:var(--soft);font:600 14px/1 var(--display);cursor:pointer;list-style:none;}
  .resin-btn::-webkit-details-marker{display:none;}
  .resin-btn::marker{content:"";}
  .resin-btn:hover{background:var(--hover);}
  .resin-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  .resin-right{display:flex;align-items:center;gap:6px;font:400 12px/1 var(--mono);color:var(--muted);}
  .chev{transition:transform .18s ease-out;}
  details[open] .chev{transform:rotate(90deg);}
  .resin-body{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 12px 6px;}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--divider);}
  .rrow:first-child{border-top:none;}
  .rlabel{flex:0 0 auto;font:500 13px/1.2 var(--display);color:var(--soft);}
  .rout{font:500 13px/1.2 var(--mono);color:var(--txt);text-align:right;}
  .rout.big{font-weight:600;font-size:14px;}
  .well{flex:0 0 auto;width:104px;height:36px;padding:0 8px;background:var(--bg);border:1px solid var(--border-control);border-radius:10px;color:var(--txt);font:500 14px/1 var(--mono);text-align:center;}
  .well:focus{background:var(--focus);outline:0;}
  .well:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

  @container (max-width:320px){
    .body{padding:10px 12px 12px;gap:9px;}
    .sinput{width:66px;font-size:15px;}
    .fl-name{font-size:13px;}
    .fl-sub{font-size:10.5px;white-space:normal;}
    .defnum{font-size:34px;}
    .result{padding:10px 12px;}
    .ghead h2{font-size:20px;}
    .well{width:88px;}
  }
  @media (prefers-reduced-motion:reduce){
    .chev,.fill{transition:none;}
  }
</style>
</head>
<body>
<h1>Gacha Tracker</h1>
<main class="games" id="games"></main>
<p class="foot">values autosave locally · timer refreshes every 30s</p>
<script>
// gemPerPull: gems per pull | glitterPerPull: 2nd currency per pull (1 = direct tickets)
// targetMult: Target pulls = target count * this | deficitPerPull: gems per deficit pull (kept as in sheet)
// resinCap/regenMin: null = no resin section for that game
const GAMES = [
  { id:"NTE", gemPerPull:160, glitterPerPull:24, glitterName:"Starglitter", targetMult:80, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:35617, rolls:4, glitter:1684, pity:2, target:4, resin:24, thresh:40 } },
  { id:"ZZZ", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:160, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:28159, rolls:16, glitter:1400, pity:30, target:2, resin:1, thresh:60 } },
  { id:"Genshin", gemPerPull:160, glitterPerPull:5, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:200, regenMin:8,
    defaults:{ gems:43971, rolls:17, glitter:127, pity:0, target:3, resin:5, thresh:40 } },
  { id:"GFL2", gemPerPull:150, glitterPerPull:30, glitterName:"Starglitter", targetMult:130, deficitPerPull:160, resinCap:260, regenMin:5,
    defaults:{ gems:62404, rolls:5, glitter:7650, pity:0, target:6, resin:22, thresh:120 } },
  { id:"CZN", gemPerPull:160, glitterPerPull:10, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:314, regenMin:6,
    defaults:{ gems:30731, rolls:13, glitter:958, pity:33, target:3, resin:105, thresh:20 } },
  { id:"Endfield", gemPerPull:500, glitterPerPull:25, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:360, regenMin:7.2,
    defaults:{ gems:45275, rolls:0, glitter:1200, pity:0, target:2, resin:8, thresh:20 } },
  { id:"Nikke", gemPerPull:300, glitterPerPull:1, glitterName:"Tickets", targetMult:200, deficitPerPull:300, resinCap:null, regenMin:null,
    defaults:{ gems:70205, rolls:0, glitter:1513, pity:0, target:9 } },
  { id:"Stella Sora", gemPerPull:300, glitterPerPull:100, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:null, regenMin:null,
    defaults:{ gems:92440, rolls:16, glitter:6320, pity:5, target:4 } },
  { id:"WuWa", gemPerPull:160, glitterPerPull:8, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:22427, rolls:16, glitter:805, pity:67, target:3, resin:1, thresh:180 } },
  { id:"HSR", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:300, regenMin:6,
    defaults:{ gems:41843, rolls:15, glitter:1820, pity:90, target:4, resin:22, thresh:60 } },
];

const $ = id => document.getElementById(id);
const NFmt = new Intl.NumberFormat();
function fmtDur(h){ if(!isFinite(h)||h<0) return "—"; if(h<=0) return "full"; const m=Math.round(h*60); return Math.floor(m/60)>0?`${Math.floor(m/60)}h ${m%60}m`:`${m%60}m`; }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtStamp(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const rawOf = id => { const el=$(id); return el?el.value.replace(/[^\d]/g,""):""; };
const numOf = id => { const r=rawOf(id); return r===""?0:+r; };
function setText(el,t){ if(el&&el.textContent!==t) el.textContent=t; }
function setNum(id,v){ const el=$(id); if(!el) return; const r=String(v==null?"":v).replace(/[^\d]/g,""); el.value = r===""?"":NFmt.format(+r); }
function fmtRaw(v){ return v===""?"":NFmt.format(+v); }

const FIELDS = [
  ["gems",   "Currency", "gemPulls"],
  ["rolls",  "Rolls",    null],
  ["glitter","Tokens",   "glitterPulls"],
  ["pity",   "Pity",     null],
  ["target", "Target",   "targetPulls"],
];

function render(g){
  const p = g.id;
  const slug = p.toLowerCase().replace(/\s+/g,"-");
  const spec = `${g.targetMult} pity · ${g.gemPerPull}/pull · ${g.glitterPerPull} tokens` + (g.resinCap?` · ${g.resinCap} cap · ${g.regenMin}min`:"");
  const fields = FIELDS.map(([key,label,subId])=>`
      <div class="field">
        <label class="fl" for="${p}-${key}">
          <span class="fl-name">${label}</span>${subId?`\n          <span class="fl-sub" id="${p}-${subId}">—</span>`:""}
        </label>
        <div class="stepper">
          <button type="button" class="step" data-target="${p}-${key}" data-d="-1" aria-label="Decrease ${label} for ${p}">−</button>
          <input class="num sinput" type="text" id="${p}-${key}" name="${p}-${key}" inputmode="numeric" autocomplete="off" aria-label="${label} for ${p}">
          <button type="button" class="step" data-target="${p}-${key}" data-d="1" aria-label="Increase ${label} for ${p}">+</button>
        </div>
      </div>`).join("");
  const hasResin = !!(g.resinCap && g.regenMin);
  const resin = hasResin ? `
    <details class="resin">
      <summary class="resin-btn">
        <span>Resin</span>
        <span class="resin-right"><span id="${p}-resinSummary">—</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </summary>
      <div class="resin-body">
        <div class="rrow"><label class="rlabel" for="${p}-resin">Last resin</label><input class="num well" type="text" id="${p}-resin" name="${p}-resin" inputmode="numeric" autocomplete="off" aria-label="Last resin for ${p}"></div>
        <div class="rrow"><div class="rlabel">Last checked</div><div class="rout" id="${p}-checked">—</div></div>
        <div class="rrow"><div class="rlabel">Time since</div><div class="rout" id="${p}-since">—</div></div>
        <div class="rrow"><div class="rlabel">Current</div><div class="rout big" id="${p}-cur">—</div></div>
        <div class="rrow"><div class="rlabel">Full in</div><div class="rout" id="${p}-fullIn">—</div></div>
        <div class="rrow"><div class="rlabel">Full at</div><div class="rout" id="${p}-fullAt">—</div></div>
        <div class="rrow"><label class="rlabel" for="${p}-thresh">X</label><input class="num well" type="text" id="${p}-thresh" name="${p}-thresh" inputmode="numeric" autocomplete="off" aria-label="Resin alert threshold for ${p}"></div>
        <div class="rrow"><div class="rlabel">X in</div><div class="rout" id="${p}-xIn">—</div></div>
      </div>
    </details>` : "";
  return `<div class="game" id="game-${p}">
    <div class="ghead" style="background-image:url('assets/${slug}.jpg')">
      <h2 translate="no">${p}</h2>
      <span class="info-wrap">
        <button type="button" class="info" aria-label="${p} rates and limits" aria-describedby="${p}-tip">i</button>
        <span class="tip" role="tooltip" id="${p}-tip">${spec}</span>
      </span>
    </div>
    <div class="body">
      <section class="result" aria-live="polite">
        <div class="result-top">
          <div class="deficit"><b class="defnum" id="${p}-defPulls">—</b><span id="${p}-defLabel">pulls short</span></div>
          <div class="need"><span class="cat">Need</span><b id="${p}-defGems">—</b></div>
        </div>
        <div class="bar" id="${p}-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress toward target"><span class="fill" id="${p}-fill"></span></div>
        <div class="caption">
          <span class="a"><span id="${p}-eff">—</span> eff. rolls</span>
          <span class="b"><span id="${p}-need">—</span> needed (<span id="${p}-targetEcho">—</span> − <span id="${p}-pityEcho">—</span> pity)</span>
        </div>
      </section>
      <div class="fields">${fields}
      </div>
      ${resin}
    </div>
  </div>`;
}

function calc(g){
  const p = g.id;
  const gem=numOf(`${p}-gems`), rol=numOf(`${p}-rolls`), gli=numOf(`${p}-glitter`), pity=numOf(`${p}-pity`), tgt=numOf(`${p}-target`);
  const gp=Math.floor(gem/g.gemPerPull), sp=Math.floor(gli/g.glitterPerPull);
  const eff=gp+rol+sp, need=tgt*g.targetMult, pulls=need-pity, def=need-pity-eff;

  setText($(`${p}-gemPulls`), `= ${NFmt.format(gp)} pulls`);
  setText($(`${p}-glitterPulls`), `= ${NFmt.format(sp)} pulls`);
  setText($(`${p}-targetPulls`), `= ${NFmt.format(need)} pulls`);

  const short = def>0, big=$(`${p}-defPulls`);
  setText(big, NFmt.format(short?def:Math.abs(def)));
  big.className = "defnum"+(short?"":" done");
  setText($(`${p}-defLabel`), short?"pulls short":(def===0?"goal reached":"pulls spare"));
  setText($(`${p}-defGems`), short?NFmt.format(def*g.deficitPerPull):"0");
  setText($(`${p}-eff`), NFmt.format(eff));
  setText($(`${p}-need`), NFmt.format(pulls));
  setText($(`${p}-targetEcho`), NFmt.format(need));
  setText($(`${p}-pityEcho`), NFmt.format(pity));

  const pct = pulls<=0 ? 100 : Math.max(0, Math.min(100, eff/pulls*100));
  $(`${p}-fill`).style.width = pct.toFixed(1)+"%";
  $(`${p}-bar`).setAttribute("aria-valuenow", String(Math.round(pct)));

  const root=$("game-"+p);
  if(root) root.querySelectorAll('.step[data-d="-1"]').forEach(b=>{ b.disabled = numOf(b.dataset.target)<=0; });

  if(g.resinCap && g.regenMin){
    const last=numOf(`${p}-resin`), t=CHECKED[p]?new Date(CHECKED[p]):null;
    if(t&&!isNaN(t)){
      const elMin=Math.max(0,(Date.now()-t.getTime())/60000);
      const cur=Math.min(g.resinCap,last+elMin/g.regenMin);
      const fullH=(g.resinCap-cur)*g.regenMin/60, X=numOf(`${p}-thresh`), xH=Math.max(0,(X-cur)*g.regenMin/60);
      setText($(`${p}-checked`), fmtStamp(t));
      setText($(`${p}-since`), `${Math.floor(elMin/60)}h ${Math.floor(elMin%60)}m ago`);
      setText($(`${p}-cur`), `${Math.floor(cur)} / ${g.resinCap}`);
      setText($(`${p}-fullIn`), fmtDur(fullH));
      setText($(`${p}-fullAt`), fullH<=0?"—":fmtStamp(new Date(Date.now()+fullH*3600e3)));
      setText($(`${p}-xIn`), X<=0?"—":(xH<=0?"reached":fmtDur(xH)));
      setText($(`${p}-resinSummary`), `${Math.floor(cur)}/${g.resinCap}`);
    } else {
      ["checked","since","cur","fullIn","fullAt","xIn"].forEach(k=>setText($(`${p}-${k}`),"—"));
      setText($(`${p}-resinSummary`),"—");
    }
  }
  const data={gems:rawOf(`${p}-gems`),rolls:rawOf(`${p}-rolls`),glitter:rawOf(`${p}-glitter`),pity:rawOf(`${p}-pity`),target:rawOf(`${p}-target`)};
  if(g.resinCap){ data.resin=rawOf(`${p}-resin`); data.checked=CHECKED[p]||""; data.thresh=rawOf(`${p}-thresh`); }
  localStorage.setItem("gacha-"+p, JSON.stringify(data));
}
function calcAll(){ GAMES.forEach(calc); }
const CHECKED = {};   // per-game "last checked" stamp (local "YYYY-MM-DDTHH:mm"), set only by editing Last resin

(function init(){
  $("games").innerHTML = GAMES.map(render).join("");

  // numeric inputs: raw while focused, thousands-separated when not
  document.querySelectorAll(".num").forEach(el=>{
    el.addEventListener("focus", ()=>{ el.value = el.value.replace(/[^\d]/g,""); });
    el.addEventListener("blur", ()=>{ el.value = fmtRaw(el.value.replace(/[^\d]/g,"")); calcAll(); });
  });
  document.addEventListener("input", e=>{
    const el = e.target;
    if(!el.classList || !el.classList.contains("num")) return;
    const raw = el.value.replace(/[^\d]/g,"");
    if(el.value !== raw) el.value = raw;
    calcAll();
  });

  // steppers
  document.querySelectorAll(".step").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const inp = $(btn.dataset.target);
      const v = Math.max(0, numOf(btn.dataset.target) + (+btn.dataset.d));
      inp.value = String(v);
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.value = NFmt.format(v);
    });
  });

  GAMES.forEach(g=>{
    const p=g.id; let s={}; try{ s=JSON.parse(localStorage.getItem("gacha-"+p)||"{}"); }catch{}
    setNum(`${p}-gems`, s.gems??g.defaults.gems);
    setNum(`${p}-rolls`, s.rolls??g.defaults.rolls);
    setNum(`${p}-glitter`, s.glitter??g.defaults.glitter);
    setNum(`${p}-pity`, s.pity??g.defaults.pity);
    setNum(`${p}-target`, s.target??g.defaults.target);
    if(g.resinCap && g.regenMin){
      setNum(`${p}-resin`, s.resin??g.defaults.resin);
      setNum(`${p}-thresh`, s.thresh??g.defaults.thresh);
      CHECKED[p] = s.checked || "";
      $(`${p}-resin`).addEventListener("input", ()=>{ CHECKED[p]=nowLocal(); });
    }
  });

  calcAll(); setInterval(calcAll,30000);
})();
</script>
</body>
</html>
