<script>
/* ===== data: per-game config — the only constants that vary per game ===== */
// gemPerPull: gems per pull | glitterPerPull: 2nd currency per pull (1 = direct tickets)
// targetMult: Target pulls = target count * this | deficitPerPull: gems per deficit pull (kept as in sheet)
// resinCap/regenMin: null = no resin section for that game
const GAMES = [
  { id:"NTE", gemPerPull:160, glitterPerPull:24, glitterName:"Starglitter", targetMult:80, deficitPerPull:160, resinCap:360, regenMin:6,
    defaults:{ gems:35617, rolls:4, glitter:1684, pity:2, target:4, resin:24, thresh:40 } },
  { id:"ZZZ", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:160, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:28159, rolls:16, glitter:1400, pity:30, target:2, resin:1, thresh:60 } },
  { id:"GFL2", gemPerPull:150, glitterPerPull:30, glitterName:"Starglitter", targetMult:130, deficitPerPull:160, resinCap:260, regenMin:5,
    defaults:{ gems:62404, rolls:5, glitter:7650, pity:0, target:6, resin:22, thresh:120 } },
  { id:"CZN", gemPerPull:160, glitterPerPull:10, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:320, regenMin:6,
    defaults:{ gems:30731, rolls:13, glitter:958, pity:33, target:3, resin:105, thresh:20 } },
  { id:"Endfield", gemPerPull:500, glitterPerPull:25, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:360, regenMin:7.2,
    defaults:{ gems:45275, rolls:0, glitter:1200, pity:0, target:2, resin:8, thresh:20 } },
  { id:"WuWa", gemPerPull:160, glitterPerPull:8, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:240, regenMin:6,
    defaults:{ gems:22427, rolls:16, glitter:805, pity:67, target:3, resin:1, thresh:180 } },
  { id:"Nikke", gemPerPull:300, glitterPerPull:1, glitterName:"Tickets", targetMult:200, deficitPerPull:300, resinCap:null, regenMin:null,
    defaults:{ gems:70205, rolls:0, glitter:1513, pity:0, target:9 } },
  { id:"Genshin", gemPerPull:160, glitterPerPull:5, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:200, regenMin:8,
    defaults:{ gems:43971, rolls:17, glitter:127, pity:0, target:3, resin:5, thresh:40 } },
  { id:"Stella Sora", gemPerPull:300, glitterPerPull:100, glitterName:"Starglitter", targetMult:120, deficitPerPull:160, resinCap:240, regenMin:null,
    defaults:{ gems:92440, rolls:16, glitter:6320, pity:5, target:4 } },
  { id:"HSR", gemPerPull:160, glitterPerPull:20, glitterName:"Starglitter", targetMult:150, deficitPerPull:160, resinCap:300, regenMin:6,
    defaults:{ gems:41843, rolls:15, glitter:1820, pity:90, target:4, resin:22, thresh:60 } },
];

/* ===== pure math: no DOM, no globals — unit-tested by test/calc.test.js =====
   Keep this section DOM-free: it is the natural seam if the file is ever split.
   computePulls(g, v)      -> pull counts, effective rolls, need, deficit, progress
   computeResin(g, v, now) -> resin regen state, or null when never checked     */
function computePulls(g, v){
  const gemPulls   = Math.floor((v.gems||0)/g.gemPerPull);
  const tokenPulls = Math.floor((v.glitter||0)/g.glitterPerPull);
  const pity = v.pity||0, target = v.target||0;
  const eff = gemPulls + (v.rolls||0) + tokenPulls;
  const need = target*g.targetMult, pulls = need - pity, def = pulls - eff;
  return {
    gemPulls, tokenPulls, pity, target, eff, need, pulls, def,
    short: def>0,
    needCurrency: def>0 ? def*g.deficitPerPull : 0,
    pct: pulls<=0 ? 100 : Math.max(0, Math.min(100, eff/pulls*100)),
  };
}
function computeResin(g, v, now){
  if(!g.resinCap || !g.regenMin) return null;
  const t = v.checked ? new Date(v.checked) : null;
  if(!t || isNaN(t)) return null;
  const elMin  = Math.max(0,(now - t.getTime())/60000);
  const cur    = Math.min(g.resinCap, (v.resin||0) + elMin/g.regenMin);
  const thresh = v.thresh||0;
  return {
    t, elMin, cur, thresh,
    fullH: (g.resinCap-cur)*g.regenMin/60,
    xH:    Math.max(0,(thresh-cur)*g.regenMin/60),
  };
}

/* sync planner: what to do when this device and Google Drive disagree.
   Times are ms since epoch. "ask" = this device has edits Drive has not seen AND Drive is newer. */
function planSync({hasRemote, same, remoteT, localT, synced, linked}){
  if(!hasRemote) return "push";
  if(same) return "settle";
  if(remoteT <= localT) return "push";
  return (!linked || localT > synced) ? "ask" : "pull";
}
function validCznPulls(value){
  return Array.isArray(value) && value.every(x=>x && typeof x==="object" && !Array.isArray(x)
    && typeof x.n==="string" && x.n.trim()!=="" && Number.isInteger(x.p) && x.p>=0 && x.p<=70
    && (x.ego==null || typeof x.ego==="string"));
}

/* ===== helpers: DOM lookups + number/date formatting ===== */
const $ = id => document.getElementById(id);
const NFmt = new Intl.NumberFormat();
function fmtDur(h){ if(!isFinite(h)||h<0) return "—"; if(h<=0) return "full"; const m=Math.round(h*60); return Math.floor(m/60)>0?`${Math.floor(m/60)}h ${m%60}m`:`${m%60}m`; }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtStamp(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const rawOf = id => { const el=$(id); return el?el.value.replace(/[^\d]/g,""):""; };
const numOf = id => { const r=rawOf(id); return r===""?0:+r; };
function setText(el,t){ if(el&&el.textContent!==t) el.textContent=t; }
function setNum(id,v){ const el=$(id); if(!el) return; const r=String(v==null?"":v).replace(/[^\d]/g,""); el.value = r===""?"":NFmt.format(+r); }
function fmtRaw(v){ return v===""?"":NFmt.format(+v); }

/* ===== view: card markup (element ids are the contract with calc() below) ===== */
const FIELDS = [
  ["gems",   "Currency", "gemPulls"],
  ["rolls",  "Rolls",    null],
  ["glitter","Tokens",   "glitterPulls"],
  ["pity",   "Pity",     null],
  ["target", "Target",   "targetPulls"],
];

function render(g){
  const p = g.id;
  const slug = p.toLowerCase().replace(/\s+/g,"-");
  const spec = `${g.targetMult} pity · ${g.gemPerPull}/pull · ${g.glitterPerPull} tokens` + (g.resinCap?` · ${g.resinCap} cap · ${g.regenMin}min`:"");
  const fields = FIELDS.map(([key,label,subId])=>`
      <div class="field">
        <label class="fl" for="${p}-${key}">
          <span class="fl-name">${label}</span>${subId?`\n          <span class="fl-sub" id="${p}-${subId}">—</span>`:""}
        </label>
        <div class="stepper">
          <button type="button" tabindex="-1" class="step" data-target="${p}-${key}" data-d="-1" aria-label="Decrease ${label} for ${p}">−</button>
          <input class="num sinput" type="text" id="${p}-${key}" name="${p}-${key}" inputmode="numeric" autocomplete="off" aria-label="${label} for ${p}">
          <button type="button" tabindex="-1" class="step" data-target="${p}-${key}" data-d="1" aria-label="Increase ${label} for ${p}">+</button>
        </div>
      </div>`).join("");
  const hasResin = !!(g.resinCap && g.regenMin);
  const resin = hasResin ? `
    <details class="resin">
      <summary class="resin-btn">
        <span>Resin</span>
        <span class="resin-right"><span id="${p}-resinSummary">—</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </summary>
      <div class="resin-body">
        <div class="rrow"><label class="rlabel" for="${p}-resin">Last resin</label><input class="num well" type="text" id="${p}-resin" name="${p}-resin" inputmode="numeric" autocomplete="off" aria-label="Last resin for ${p}"></div>
        <div class="rrow"><div class="rlabel">Last checked</div><div class="rout" id="${p}-checked">—</div></div>
        <div class="rrow"><div class="rlabel">Time since</div><div class="rout" id="${p}-since">—</div></div>
        <div class="rrow"><div class="rlabel">Current</div><div class="rout big" id="${p}-cur">—</div></div>
        <div class="rrow"><div class="rlabel">Full in</div><div class="rout" id="${p}-fullIn">—</div></div>
        <div class="rrow"><div class="rlabel">Full at</div><div class="rout" id="${p}-fullAt">—</div></div>
        <div class="rrow"><label class="rlabel" for="${p}-thresh">X</label><input class="num well" type="text" id="${p}-thresh" name="${p}-thresh" inputmode="numeric" autocomplete="off" aria-label="Resin alert threshold for ${p}"></div>
        <div class="rrow"><div class="rlabel">X in</div><div class="rout" id="${p}-xIn">—</div></div>
      </div>
    </details>` : "";
  return `<div class="game" id="game-${p}" role="group" aria-label="${p} tracker">
    <div class="ghead" style="background-image:url('assets/${slug}.jpg')">
      <span class="info-wrap">
        <button type="button" tabindex="-1" class="info" aria-label="${p} rates and limits" aria-describedby="${p}-tip">i</button>
        <span class="tip" role="tooltip" id="${p}-tip">${spec}</span>
      </span>
    </div>
    <div class="body">
      <section class="result" aria-live="polite">
        <div class="result-top">
          <div class="deficit"><b class="defnum" id="${p}-defPulls">—</b><span id="${p}-defLabel">pulls short</span></div>
          <div class="need"><span class="cat">Need</span><b id="${p}-defGems">—</b></div>
        </div>
        <div class="bar" id="${p}-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress toward target"><span class="fill" id="${p}-fill"></span></div>
        <div class="caption">
          <span class="a"><span id="${p}-eff">—</span> eff. rolls</span>
          <span class="b"><span id="${p}-need">—</span> needed (<span id="${p}-targetEcho">—</span> − <span id="${p}-pityEcho">—</span> pity)</span>
        </div>
      </section>
      <div class="fields">${fields}
      </div>
      ${resin}
    </div>
  </div>`;
}

/* ===== update: read DOM → compute → write DOM → persist ===== */
function calc(g){
  const p = g.id, now = Date.now();
  const r = computePulls(g, {
    gems:numOf(`${p}-gems`), rolls:numOf(`${p}-rolls`), glitter:numOf(`${p}-glitter`),
    pity:numOf(`${p}-pity`), target:numOf(`${p}-target`),
  });

  setText($(`${p}-gemPulls`), `= ${NFmt.format(r.gemPulls)} pulls`);
  setText($(`${p}-glitterPulls`), `= ${NFmt.format(r.tokenPulls)} pulls`);
  setText($(`${p}-targetPulls`), `= ${NFmt.format(r.need)} pulls`);

  const big=$(`${p}-defPulls`);
  setText(big, NFmt.format(r.short?r.def:Math.abs(r.def)));
  big.className = "defnum"+(r.short?"":" done");
  setText($(`${p}-defLabel`), r.short?"pulls short":(r.def===0?"goal reached":"pulls spare"));
  setText($(`${p}-defGems`), NFmt.format(r.needCurrency));
  setText($(`${p}-eff`), NFmt.format(r.eff));
  setText($(`${p}-need`), NFmt.format(r.pulls));
  setText($(`${p}-targetEcho`), NFmt.format(r.need));
  setText($(`${p}-pityEcho`), NFmt.format(r.pity));

  $(`${p}-fill`).style.width = r.pct.toFixed(1)+"%";
  $(`${p}-bar`).setAttribute("aria-valuenow", String(Math.round(r.pct)));

  const root=$("game-"+p);
  if(root) root.querySelectorAll('.step[data-d="-1"]').forEach(b=>{ b.disabled = numOf(b.dataset.target)<=0; });

  if(g.resinCap && g.regenMin){
    const rs = computeResin(g, {resin:numOf(`${p}-resin`), thresh:numOf(`${p}-thresh`), checked:CHECKED[p]}, now);
    if(rs){
      setText($(`${p}-checked`), fmtStamp(rs.t));
      setText($(`${p}-since`), `${Math.floor(rs.elMin/60)}h ${Math.floor(rs.elMin%60)}m ago`);
      setText($(`${p}-cur`), `${Math.floor(rs.cur)} / ${g.resinCap}`);
      setText($(`${p}-fullIn`), fmtDur(rs.fullH));
      setText($(`${p}-fullAt`), rs.fullH<=0?"—":fmtStamp(new Date(now+rs.fullH*3600e3)));
      setText($(`${p}-xIn`), rs.thresh<=0?"—":(rs.xH<=0?"reached":fmtDur(rs.xH)));
      setText($(`${p}-resinSummary`), `${Math.floor(rs.cur)}/${g.resinCap}`);
    } else {
      ["checked","since","cur","fullIn","fullAt","xIn"].forEach(k=>setText($(`${p}-${k}`),"—"));
      setText($(`${p}-resinSummary`),"—");
    }
  }
  const data={gems:rawOf(`${p}-gems`),rolls:rawOf(`${p}-rolls`),glitter:rawOf(`${p}-glitter`),pity:rawOf(`${p}-pity`),target:rawOf(`${p}-target`)};
  if(g.resinCap){ data.resin=rawOf(`${p}-resin`); data.checked=CHECKED[p]||""; data.thresh=rawOf(`${p}-thresh`); }
  const json = JSON.stringify(data), prev = localStorage.getItem("gacha-"+p);
  if(json !== prev){
    localStorage.setItem("gacha-"+p, json);
    if(prev !== null) markModified();   // first-ever write of defaults is not an edit
  }
}
function calcAll(){ GAMES.forEach(calc); }
const CHECKED = {};   // per-game "last checked" stamp (local "YYYY-MM-DDTHH:mm"), set only by editing Last resin

/* ===== backup: the persisted values as a .json file =====
   The file is exactly the stored shape — { "<game id>": { field: value } } — so a
   hand-edited or partial file imports fine. */
function collect(){   // { "<game id>": {stored fields} } — the game-only export/import shape
  const out = {};
  GAMES.forEach(g=>{
    try{ out[g.id] = JSON.parse(localStorage.getItem("gacha-"+g.id)||"{}"); }catch{ out[g.id] = {}; }
  });
  return out;
}
function collectCloud(){
  let czn=[];
  try{ const saved=JSON.parse(localStorage.getItem("gacha-czn-pulls")||"[]"); if(validCznPulls(saved)) czn=saved; }catch{}
  return {games:collect(), czn};
}
function exportData(){
  const out = collect();
  const name = `gacha-tracker-${nowLocal().slice(0,10)}.json`;
  const url = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)+"\n"],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return name;
}
function importData(data){   // throws on anything that is not a game map
  if(!data || typeof data !== "object" || Array.isArray(data)) throw new Error("not a game map");
  Object.keys(data).forEach(id=>localStorage.setItem("gacha-"+id, JSON.stringify(data[id])));
  loadState(); calcAll();
}
function setStatus(msg, tone){
  const el = $("status"); if(!el) return;
  el.textContent = msg||""; el.dataset.tone = tone||"";
}
async function importBackupFile(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch{ return setStatus("Could not read that file as JSON.", "err"); }
  if(!confirm(`Replace all saved values with "${file.name}"?`)) return setStatus("Import cancelled — nothing changed.", "");
  try{ importData(data); setStatus(`Imported "${file.name}".`, "ok"); }
  catch{ setStatus(`"${file.name}" is not a gacha-tracker backup.`, "err"); }
}

/* ===== cloud: optional Google Drive sync (appDataFolder) =====
   One file, gacha-tracker.json, in this app's hidden Drive folder (scope drive.appdata: the app
   cannot see any other Drive file, and the file does not show up in the user's Drive UI).
   localStorage stays the source of truth for the page; Drive is a mirror: pushed ~3s after an edit,
   pulled on start and when the tab regains focus. Last-write-wins by timestamp, with one confirm
   when both sides changed. Sign-in = Google Identity Services, storage = drivestore. Both load
   lazily, so the page works offline and with no client id. The export/import JSON is untouched. */
const GOOGLE_CLIENT_ID = "399275589256-86h33rg3f2onusmq9llauog599nifqu5.apps.googleusercontent.com";   // OAuth "Web application" client id, e.g. "1234-abcd.apps.googleusercontent.com"
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const CLOUD_FILE = "gacha-tracker.json";
const SYNC_KEY = "gacha-sync";   // { linked, modified, synced } — ms timestamps, local only
const TOKEN_KEY = "gacha-sync-token";   // { t:<access token>, exp:<ms> } — shared by every tab of this origin
const GIS_URL = "https://accounts.google.com/gsi/client";
const DRIVESTORE_URL = "https://cdn.jsdelivr.net/npm/drivestore@0.2.1/+esm";
const cloud = { libs:null, store:null, token:"", exp:0, tokenP:null, interactive:false,
                busy:false, again:false, timer:0, applying:false, state:"off", last:0 };

function syncMeta(){
  try{ const m = JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"); return (m && typeof m==="object") ? m : {}; }
  catch{ return {}; }
}
function setSyncMeta(patch){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({...syncMeta(), ...patch})); }catch{} }
function markModified(){   // called by calc() when stored values really changed
  if(cloud.applying) return;
  setSyncMeta({modified:Date.now()});
  scheduleSync();
}
function scheduleSync(){
  if(cloud.applying || !syncMeta().linked) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(()=>syncNow(), 3000);
}
function setCloudState(st){
  cloud.state = st;
  const btn = $("syncBtn"); if(!btn) return;
  const label = {
    off:  "Connect Google Drive",
    on:   cloud.last ? `Google Drive sync — last synced ${fmtStamp(new Date(cloud.last))}` : "Google Drive sync — options",
    busy: "Syncing with Google Drive…",
    err:  "Google Drive: sync failed — click to retry",
  }[st];
  btn.dataset.state = st;
  btn.setAttribute("aria-label", label);
  btn.setAttribute("title", label);
}

function loadScript(src){
  return new Promise((res, rej)=>{
    const el = document.createElement("script");
    el.src = src; el.async = true; el.onload = res;
    el.onerror = ()=>rej(new Error("Could not load "+src));
    document.head.appendChild(el);
  });
}
function ensureLibs(){
  if(!cloud.libs) cloud.libs = (async()=>{
    if(!GOOGLE_CLIENT_ID) throw new Error("no-client-id");
    if(!(window.google && google.accounts && google.accounts.oauth2)) await loadScript(GIS_URL);
    const mod = await import(DRIVESTORE_URL);
    // drivestore@0.2.1 calls the fetch you pass in as a method of its own options object, so `this`
    // is not the Window. Chrome ignores that, Firefox throws "'fetch' called on an object that does
    // not implement interface Window" on every request. The arrow wrapper pins the receiver to
    // window; it wraps reads and writes alike. Re-check on any drivestore bump.
    // A 401 means the stored token is dead (expired early, revoked, or disconnected in another tab):
    // drop it here so drivestore's own one-shot 401 retry calls getToken() and gets a fresh one.
    cloud.store = mod.createDriveStore({ accessToken:getToken, rootName:"gacha-tracker",
                                         fetch:async (...a)=>{ const r = await window.fetch(...a); if(r.status === 401) dropToken(); return r; } });
  })().catch(e=>{ cloud.libs = null; throw e; });
  return cloud.libs;
}
// The access token is kept in localStorage (key gacha-sync-token) so a reload or a second tab reuses it
// instead of asking Google again. Trade-off: any script running on this origin can read it; it is
// limited to the drive.appdata scope and lives ~1h. cloud.token/exp is only the fallback for when
// localStorage is unavailable (private mode / blocked), where it behaves as before: per tab.
function readToken(){
  try{
    const o = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    if(o && o.t && Date.now() < o.exp) return o.t;
  }catch{}
  return (cloud.token && Date.now() < cloud.exp) ? cloud.token : "";
}
function storeToken(t, exp){
  cloud.token = t; cloud.exp = exp;
  try{ localStorage.setItem(TOKEN_KEY, JSON.stringify({t, exp})); }catch{}
}
function dropToken(){
  cloud.token = ""; cloud.exp = 0;
  try{ localStorage.removeItem(TOKEN_KEY); }catch{}
}
// access tokens last ~1h and there is no refresh token in the browser flow, so renewal asks Google
// again: silently (prompt "none") during auto-sync, with UI only when the user clicked something.
function requestToken(silent){
  return new Promise((resolve, reject)=>{
    const fail = code=>{ const e = new Error(code); e.auth = true; reject(e); };
    google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, prompt: silent ? "none" : "",
      callback: r=>{
        if(r.error) return fail(r.error);
        if(!google.accounts.oauth2.hasGrantedAllScopes(r, DRIVE_SCOPE)) return fail("scope_denied");
        storeToken(r.access_token, Date.now() + (Number(r.expires_in)||3600)*1000 - 60000);
        resolve(r.access_token);
      },
      error_callback: e=>fail((e && e.type) || "popup_failed"),
    }).requestAccessToken();
  });
}
function getToken(){
  const t = readToken();   // read each time, so a token another tab just refreshed is picked up
  if(t) return Promise.resolve(t);
  if(!cloud.tokenP) cloud.tokenP = requestToken(!cloud.interactive).finally(()=>{ cloud.tokenP = null; });
  return cloud.tokenP;
}

async function readRemote(){   // null when there is no file yet
  let txt;
  try{ txt = await cloud.store.read(CLOUD_FILE); }
  catch(e){ if(e && e.status === 404) return null; throw e; }
  let j; try{ j = JSON.parse(txt); }catch{ throw new Error("bad-remote"); }
  if(!j || !j.games || typeof j.games !== "object" || Array.isArray(j.games)) throw new Error("bad-remote");
  if(j.czn!==undefined && !validCznPulls(j.czn)) throw new Error("bad-remote");
  return j;
}
function sameGames(a, b){
  return GAMES.every(g=>JSON.stringify((a && a[g.id])||{}) === JSON.stringify((b && b[g.id])||{}));
}
function sameCloud(a,b){
  return sameGames(a && a.games,b && b.games)
    && (!(a && a.czn!==undefined) || JSON.stringify(a.czn) === JSON.stringify((b && b.czn)||[]));
}
function applyRemote(games, czn){   // only known game ids, same path as a file import
  const pick = {};
  GAMES.forEach(g=>{ if(games[g.id] && typeof games[g.id] === "object") pick[g.id] = games[g.id]; });
  cloud.applying = true;
  try{
    importData(pick);
    if(czn!==undefined && validCznPulls(czn)) localStorage.setItem("gacha-czn-pulls",JSON.stringify(czn));
  } finally{ cloud.applying = false; }
}
async function pushRemote(local, t){
  await cloud.store.write(CLOUD_FILE, JSON.stringify({ v:1, updatedAt:new Date(t).toISOString(), games:local.games, czn:local.czn }));
}

async function syncNow(opts){
  const interactive = !!(opts && opts.interactive);
  if(cloud.busy){ cloud.again = true; return; }
  cloud.busy = true; cloud.interactive = interactive;
  setCloudState("busy");
  try{
    await ensureLibs();
    const remote = await readRemote();
    const m = syncMeta(), local = collectCloud(), localT = m.modified || 0;
    const remoteT = remote ? (Date.parse(remote.updatedAt) || 0) : 0;
    let plan = planSync({ hasRemote:!!remote, same:!!remote && sameCloud(remote, local),
                          remoteT, localT, synced:m.synced || 0, linked:!!m.linked });
    let forced = false;
    if(plan === "ask"){
      const ok = confirm(`Google Drive already has saved values (${fmtStamp(new Date(remoteT))}).\n\n`
        + `OK: load the Drive copy and replace the values on this device.\n`
        + `Cancel: keep this device's values and overwrite the Drive copy.`);
      plan = ok ? "pull" : "push"; forced = !ok;
    }
    if(plan === "pull"){
      applyRemote(remote.games, remote.czn);
      if(remote.czn===undefined) await pushRemote(collectCloud(),remoteT);   // upgrade legacy backup, preserving local CZN history
      setSyncMeta({ linked:true, modified:remoteT, synced:remoteT });
      setStatus("Loaded values from Google Drive.", "ok");
    } else if(plan === "push"){
      const t = forced ? Date.now() : (localT || Date.now());
      await pushRemote(local, t);
      setSyncMeta({ linked:true, modified:t, synced:t });
      if(interactive) setStatus("Saved to Google Drive.", "ok");
    } else {   // settle: identical data, just align the stamps
      const t = remoteT || localT || Date.now();
      if(remote && remote.czn===undefined) await pushRemote(local,t);   // add the new field to an older backup
      setSyncMeta({ linked:true, modified:t, synced:t });
      if(interactive) setStatus("Google Drive is up to date.", "ok");
    }
    cloud.last = Date.now();
    setCloudState("on");
  }catch(e){
    console.error("[cloud sync]", e);
    if(e && e.status === 401) dropToken();
    setCloudState(syncMeta().linked ? "err" : "off");
    const body = String((e && e.body) || "");
    let msg;
    if(e.message === "no-client-id") msg = "Cloud sync is not configured — set GOOGLE_CLIENT_ID in index.html.";
    else if(e.message === "scope_denied") msg = "Drive access was not granted — tick the permission box on Google's consent screen.";
    else if(e.auth) msg = interactive ? "Google sign-in was cancelled or blocked." : "Google Drive needs you to sign in again — click the cloud button.";
    else if(e.message === "bad-remote") msg = "The file on Google Drive is not readable, so nothing was changed.";
    else if(e.status === 403 && /SERVICE_DISABLED|has not been used/i.test(body)) msg = "Enable the Google Drive API for this Google Cloud project.";
    else if(e instanceof TypeError) msg = `Could not reach Google Drive (${e.message}).`;
    else msg = `Google Drive sync failed (${e.status || e.message}).`;
    setStatus(msg, "err");
  }finally{
    cloud.busy = false; cloud.interactive = false;
    if(cloud.again){ cloud.again = false; scheduleSync(); }
  }
}
function disconnect(){
  clearTimeout(cloud.timer);
  const t = readToken();   // survives reloads now, so it can be revoked even in a fresh tab
  try{
    if(t && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(t, ()=>{});
    else if(t) fetch("https://oauth2.googleapis.com/revoke", { method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"token="+encodeURIComponent(t) }).catch(()=>{});
  }catch{}
  dropToken(); cloud.last = 0;
  setSyncMeta({ linked:false, synced:0 });
  setCloudState("off");
  setStatus("Disconnected from Google Drive. Values stay on this device; the Drive copy is left as it was.", "");
}
function initCloud(){
  const btn = $("syncBtn"), menu = $("syncMenu");
  if(!btn || !menu) return;
  const open = ()=>{ menu.hidden = false; btn.setAttribute("aria-expanded","true"); };
  const close = refocus=>{ menu.hidden = true; btn.setAttribute("aria-expanded","false"); if(refocus) btn.focus(); };

  // warm the libraries up before the click so Google's sign-in popup is not blocked by the load delay
  const warm = ()=>{ if(GOOGLE_CLIENT_ID) ensureLibs().catch(()=>{}); };
  btn.addEventListener("pointerenter", warm, {once:true});
  btn.addEventListener("focus", warm, {once:true});

  btn.addEventListener("click", e=>{
    e.stopPropagation();
    if(!GOOGLE_CLIENT_ID) return setStatus("Cloud sync is not configured — set GOOGLE_CLIENT_ID in index.html.", "err");
    if(!syncMeta().linked || cloud.state === "off" || cloud.state === "err"){ close(false); syncNow({interactive:true}); return; }
    menu.hidden ? open() : close(false);
  });
  menu.addEventListener("click", e=>{
    const b = e.target.closest("[data-act]"); if(!b) return;
    close(true);
    if(b.dataset.act === "sync") syncNow({interactive:true}); else disconnect();
  });
  document.addEventListener("click", e=>{ if(!menu.hidden && !e.target.closest(".theme-wrap")) close(false); });
  document.addEventListener("keydown", e=>{
    if(menu.hidden) return;
    const list = Array.from(menu.querySelectorAll("[data-act]")), cur = list.indexOf(document.activeElement);
    if(e.key === "Escape"){ close(true); e.preventDefault(); }
    else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      list[cur < 0 ? 0 : (e.key === "ArrowDown" ? (cur+1)%list.length : (cur-1+list.length)%list.length)].focus();
    }
    else if(e.key === "Tab"){ close(false); }
  });
  window.addEventListener("storage", e=>{
    if(e.key===SYNC_KEY && syncMeta().linked) scheduleSync();
  });
  document.addEventListener("visibilitychange", ()=>{   // pick up edits made on another device
    if(document.visibilityState === "visible" && syncMeta().linked && Date.now() - cloud.last > 60000) syncNow();
  });
  setCloudState(syncMeta().linked ? "on" : "off");
}

/* ===== theme: palette switch (layout is shared; only the CSS tokens change) =====
   The choice lives in its own localStorage key so the game data and the
   export/import JSON format stay exactly as documented. */
const THEMES = [
  { id:"midnight", name:"Midnight", swatch:"#5CE1E6", page:"#05060B" },
  { id:"lime",     name:"Lime",     swatch:"#76c442", page:"#161313" },
  { id:"tactical-hud", name:"Tactical (HUD)", swatch:"#35e6ff", page:"#050c13" },
];
const THEME_KEY = "gacha-theme";

function currentTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.some(x=>x.id===t) ? t : "midnight";
  }catch{ return "midnight"; }
}
function applyTheme(id, announce){
  const th = THEMES.find(x=>x.id===id) || THEMES[0];
  document.documentElement.dataset.theme = th.id;
  try{ localStorage.setItem(THEME_KEY, th.id); }catch{}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = th.page;
  document.querySelectorAll(".theme-opt").forEach(b=>{
    const on = b.dataset.theme === th.id;
    b.setAttribute("aria-selected", on ? "true" : "false");
    const chk = b.querySelector(".check");
    if(chk) chk.textContent = on ? "✓" : "";
  });
  const btn = $("themeBtn");
  if(btn){
    btn.setAttribute("aria-label", `Theme: ${th.name} — change`);
    btn.setAttribute("title", `Theme: ${th.name}`);
  }
  if(announce) setStatus(`Theme: ${th.name}.`);
}
function initTheme(){
  const btn = $("themeBtn"), menu = $("themeMenu");
  if(!btn || !menu) return;
  menu.innerHTML = THEMES.map(t=>`
      <button type="button" class="theme-opt" role="option" aria-selected="false" data-theme="${t.id}">
        <span class="swatch" style="background:${t.swatch}"></span>
        <span class="tname">${t.name}</span>
        <span class="check"></span>
      </button>`).join("");
  const opts = () => Array.from(menu.querySelectorAll(".theme-opt"));
  const isOpen = () => !menu.hidden;
  const open = () => { menu.hidden = false; btn.setAttribute("aria-expanded","true"); };
  const close = (refocus) => { menu.hidden = true; btn.setAttribute("aria-expanded","false"); if(refocus) btn.focus(); };

  btn.addEventListener("click", e=>{ e.stopPropagation(); isOpen() ? close(false) : open(); });
  menu.addEventListener("click", e=>{
    const b = e.target.closest(".theme-opt");
    if(!b) return;
    applyTheme(b.dataset.theme, true);
    close(false); btn.focus();
  });
  document.addEventListener("click", e=>{ if(isOpen() && !e.target.closest(".theme-wrap")) close(false); });
  document.addEventListener("keydown", e=>{
    if(!isOpen()) return;
    const list = opts(), cur = list.indexOf(document.activeElement);
    if(e.key === "Escape"){ close(true); e.preventDefault(); }
    else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const next = cur < 0 ? 0 : (e.key === "ArrowDown" ? (cur+1)%list.length : (cur-1+list.length)%list.length);
      list[next].focus();
    }
    else if(e.key === "Home"){ e.preventDefault(); list[0].focus(); }
    else if(e.key === "End"){ e.preventDefault(); list[list.length-1].focus(); }
    else if(e.key === "Tab"){ close(false); }
  });
  applyTheme(currentTheme(), false);
}

/* ===== startup: mount cards, wire events, load saved state ===== */
// fill every input from localStorage, falling back to each game's defaults
function loadState(){
  GAMES.forEach(g=>{
    const p = g.id; let s = {};
    try{ s = JSON.parse(localStorage.getItem("gacha-"+p)||"{}"); }catch{}
    if(!s || typeof s !== "object") s = {};
    FIELDS.forEach(([key])=>{ setNum(`${p}-${key}`, s[key] ?? g.defaults[key]); });
    if(g.resinCap && g.regenMin){
      setNum(`${p}-resin`, s.resin ?? g.defaults.resin);
      setNum(`${p}-thresh`, s.thresh ?? g.defaults.thresh);
      CHECKED[p] = s.checked || "";
    }
  });
}

function init(){
  $("games").innerHTML = GAMES.map(render).join("");

  // numeric inputs: raw while focused, thousands-separated when not
  document.querySelectorAll(".num").forEach(el=>{
    el.addEventListener("focus", ()=>{ el.value = el.value.replace(/[^\d]/g,""); });
    el.addEventListener("blur", ()=>{ el.value = fmtRaw(el.value.replace(/[^\d]/g,"")); calcAll(); });
    if(el.id.endsWith("-gems")) el.addEventListener("click", ()=>el.select());
  });
  document.addEventListener("input", e=>{
    const el = e.target;
    if(!el.classList || !el.classList.contains("num")) return;
    const raw = el.value.replace(/[^\d]/g,"");
    if(el.value !== raw) el.value = raw;
    calcAll();
  });

  // steppers
  document.querySelectorAll(".step").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const inp = $(btn.dataset.target);
      const v = Math.max(0, numOf(btn.dataset.target) + (+btn.dataset.d));
      inp.value = String(v);
      inp.dispatchEvent(new Event("input",{bubbles:true}));
      inp.value = NFmt.format(v);
    });
  });

  GAMES.forEach(g=>{
    if(g.resinCap && g.regenMin) $(`${g.id}-resin`).addEventListener("input", ()=>{ CHECKED[g.id]=nowLocal(); });
  });

  // export / import the saved state as a .json file
  $("exportBtn").addEventListener("click", ()=>{ setStatus(`Exported all ${GAMES.length} games to ${exportData()}.`, "ok"); });
  $("importBtn").addEventListener("click", ()=>$("importFile").click());
  $("importFile").addEventListener("change", e=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = "";   // clear so re-picking the same file fires again
    if(file) importBackupFile(file);
  });

  initTheme();
  initCloud();

  loadState();
  calcAll(); setInterval(calcAll,30000);
  if(syncMeta().linked) syncNow();   // pull/push once on start (silent; no popup)
}
if(typeof document !== "undefined") init();   // undefined in node, so tests can load the math
</script>
